name: nirmadapp
description: "NIRMAD FLUTTER APP"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  indian_currency_to_word: ^1.0.0
  # Removed wizard_stepper: migrated to native Flutter Stepper
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  cloud_functions: ^6.0.0
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.1
  go_transitions: ^0.8.2
  animations: ^2.0.11
  responsiveness: ^1.2.8
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_dotenv: ^6.0.0
  intl: ^0.20.2
  package_info_plus: ^8.3.1
  file_picker: ^10.3.2
  image_picker: ^1.2.0
  url_launcher: ^6.3.0
  file_saver: ^0.2.12
  dio: ^5.7.0
  path_provider: ^2.1.5
  csv: ^6.0.0
  excel: ^4.0.3
  pdf: ^3.11.0
  printing: ^5.13.4
  cross_file: ^0.3.4+2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^1.0.0
  timelines_plus: ^1.0.7
  cupertino_sidebar: ^1.0.1
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  flutter_animate: ^4.5.0
  keyboard_dismisser: ^3.0.0
  gap: ^3.0.1
  hash_cached_image: ^0.0.2
  avatar_better_pro: ^0.0.4
  image: ^4.3.0
  shared_preferences: ^2.3.2
  flutter_svg: ^2.2.0
  google_fonts: ^6.3.1
  connectivity_plus: ^6.1.5
  any_date: ^1.2.0
  flutter_map: ^8.2.1
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  flutter_map_location_marker: ^10.1.0
  toastification: ^3.0.3
  logger: ^2.6.1
  fire_storage_impl: ^0.1.0
  path: ^1.9.0
  flutter_slidable: ^4.0.1
  permission_handler: ^11.3.1
  open_file: ^3.5.10
  mime: ^2.0.0
  hybrid_list_tile: ^1.0.5
  tbib_downloader: ^2.4.0
  downloadsfolder: ^1.2.0
  awesome_notifications: ^0.10.1
  load_it: ^0.0.2

dev_dependencies:
  brand_forge:
    git:
      url: https://github.com/Dhanabhon/brand_forge.git
      ref: main

  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_native_splash: ^2.4.4
  flutter_launcher_icons: ^0.14.4

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#000000"
  image: "assets/logo.png"
  image_dark: "assets/logo.png"
  android: true
  ios: true
  web: true
  android_12:
    image: "assets/logo.png"
    image_dark: "assets/logo.png"
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#000000"

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/logo.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - .env
    - assets/logo.png
    - local_data.json
